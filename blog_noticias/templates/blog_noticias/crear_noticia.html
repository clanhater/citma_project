{% extends 'core/base.html' %}
{% load static %}

{% block content %}
<div class="container my-4">
  <h2>{% if modo_edicion %}Editar noticia{% else %}Crear noticia{% endif %}</h2>

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.media }}

    <!-- Tarjeta superior -->
    <div class="card mb-4">
      <div class="card-body">
        <div class="row g-3 align-items-end">
          <div class="col-md-4">
            <label for="id_titulo" class="form-label">Título</label>
            <input type="text" name="titulo" id="id_titulo" class="form-control" value="{{ form.instance.titulo }}" required>
          </div>
          <div class="col-md-4">
            <label for="id_categoria" class="form-label">Categoría</label>
            <select name="categoria" id="id_categoria" class="form-select">
              {% for categoria in form.fields.categoria.queryset %}
                <option value="{{ categoria.id }}" {% if form.instance.categoria.id == categoria.id %}selected{% endif %}>{{ categoria }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-4">
            <label for="id_imagen" class="form-label">Imagen</label>
            <input type="file" name="imagen" id="id_imagen" class="form-control">
          </div>
          <div class="col-md-8">
            <label for="id_descripcion" class="form-label">Descripción</label>
            <textarea name="descripcion" id="id_descripcion" class="form-control" rows="2">{{form.instance.descripcion}}</textarea>
          </div>
          <div class="col-md-4 text-end">
            <button type="submit" class="btn btn-primary">{% if modo_edicion %}Guardar cambios{% else %}Publicar{% endif %}</button>
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-center">
        <div class="w-100" style="max-width: 960px;">
        {{ form.content }}
        </div>
    </div>

  </form>
</div>
{% endblock %}
