{% extends 'core/base.html' %}

{% block content %}
<div class="container my-5">
    <h3 class="mb-4 text-center">¿A dónde deseas ir?</h3>
    <div class="row g-4">
      <div class="col-md-4">
        <div class="card h-100 shadow-sm">
          <div class="card-body text-center">
            <i class="fas fa-briefcase fa-2x mb-3 text-primary"></i>
            <h5 class="card-title">Recursos Humanos</h5>
            <p class="card-text">Gestión de empleos y solicitudes.</p>
            <a href="{% url 'empleos:panel_RRHH' %}" class="btn btn-outline-primary">Ir al panel</a>
          </div>
        </div>
      </div>
  
      <div class="col-md-4">
        <div class="card h-100 shadow-sm">
          <div class="card-body text-center">
            <i class="fas fa-newspaper fa-2x mb-3 text-success"></i>
            <h5 class="card-title">Noticias</h5>
            <p class="card-text">Crear, editar y gestionar publicaciones.</p>
            <a href="{% url 'blog_noticias:gestion' %}" class="btn btn-outline-success">Ir al panel</a>
          </div>
        </div>
      </div>
  
      <div class="col-md-4">
        <div class="card h-100 shadow-sm">
          <div class="card-body text-center">
            <i class="fas fa-cogs fa-2x mb-3 text-dark"></i>
            <h5 class="card-title">Administrador</h5>
            <p class="card-text">Administración avanzada del sistema.</p>
            <a href="/admin/" class="btn btn-outline-dark">Ir al admin</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  
{% endblock %}
