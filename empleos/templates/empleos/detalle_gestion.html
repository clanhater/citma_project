{% extends "core/base.html" %}

{% block content %}

<section class="empleo-detalle container my-4">
  <form method="POST" enctype="multipart/form-data" class="bg-light p-4 rounded-3 shadow-sm">
    {% csrf_token %}
    
    <h2 class="mb-4 text-primary">Editar Vacante</h2>
    
    <div class="row g-3 mb-4">
      <!-- Columna izquierda -->
      <div class="col-md-6">
        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="titulo" name="titulo" 
                    value="{{ empleo.titulo }}" placeholder=" " required>
            <label for="titulo">Título del puesto</label>
        </div>

        <div class="form-floating mb-3">
            <textarea class="form-control" id="descripcion" name="descripcion" 
                      style="height: 120px" placeholder=" " required>{{ empleo.descripcion }}</textarea>
            <label for="descripcion">Descripción del puesto</label>
        </div>

        <div class="documento-adjunto mb-4">
          <label for="documento_input" class="form-label fw-bold">Documento adjunto</label>
          
          <!-- Grupo de input + botones -->
          <div class="input-group">
            <!-- Input de archivo (siempre visible) -->
            <input type="file" 
                   class="form-control" 
                   id="documento_detalles" 
                   name="documento_detalles">
            
            <!-- Botón de previsualización (solo si hay archivo) -->
            {% if empleo.documento_detalles %}
            <a href="{{ empleo.documento_detalles.url }}" 
               target="_blank" 
               class="btn btn-outline-primary" 
               title="Previsualizar"
               style="display: grid; align-items: center;">
              <i class="fas fa-eye"></i>
            </a>
            {% endif %}
          </div>
      </div>
      </div>
        <!-- Columna derecha -->
        <div class="col-md-6">
            <div class="form-floating mb-3">
              <input type="text" class="form-control" id="ubicacion" name="ubicacion" 
                    value="{{ empleo.ubicacion }}" placeholder=" ">
              <label for="ubicacion">Ubicación</label>
          </div>
            <div class="form-floating mb-3">
                <select class="form-select" id="area" name="area">
                    {% for value, label in empleo.AREAS %}
                        <option value="{{ value }}" {% if empleo.area == value %}selected{% endif %}>
                            {{ label }}
                        </option>
                    {% endfor %}
                </select>
                <label for="area">Área/Departamento</label>
            </div>

            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="tipo_contrato" name="tipo_contrato" 
                        value="{{ empleo.tipo_contrato }}" placeholder=" ">
                <label for="tipo_contrato">Tipo de Contrato</label>
            </div>

            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="salario" name="salario" 
                        value="{{ empleo.salario }}" placeholder=" ">
                <label for="salario">Salario</label>
            </div>

            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="activo" name="activo" 
                        {% if empleo.activo %}checked{% endif %}>
                <label class="form-check-label mx-2" for="activo">Vacante activa</label>
            </div>
        </div>
      </div>

      <div class="d-flex justify-content-between">
          <a href="{% url 'empleos:lista_vacantes' %}" class="btn btn-secondary">
              <i class="fas fa-times me-2"></i> Cancelar
          </a>
          <button type="submit" class="btn btn-primary">
              <i class="fas fa-save me-2"></i> Guardar Cambios
          </button>
      </div>
  </form>
</section>

<style>
    .empleo-detalle .form-control:focus, 
    .empleo-detalle .form-select:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
    }
    
    .empleo-detalle .form-floating label {
        color: #6c757d;
    }
    
    .empleo-detalle .form-switch .form-check-input {
        width: 3em;
        height: 1.5em;
    }
</style>
</div>
{% endblock %}
